avatar.big{width:86px;height:86px}.initial{width:43px;height:43px;border-radius:50%;background:#c9dcff;display:grid;place-items:center;font-weight:800;color:#2862ed}.initial.big{width:86px;height:86px;font-size:27px}.metric{font-size:clamp(20px,2.3vw,30px);font-weight:850;margin:12px 0 4px}.modalbg{position:fixed;inset:0;z-index:50;background:#173059aa;display:grid;place-items:center;padding:15px}.modal{width:min(760px,100%);max-height:90vh;overflow:auto}.toast{position:fixed;bottom:20px;right:20px;z-index:100;background:#294a80;color:white;padding:14px;border-radius:12px;max-width:400px;box-shadow:0 10px 21px #a8b8d2}.bars{height:165px;display:flex;gap:8px;align-items:end}.barcell{height:100%;flex:1;display:flex;align-items:center;justify-content:end;flex-direction:column;gap:6px}.bar{background:linear-gradient(#43c4f9,#2760ea);border-radius:7px 7px 2px 2px;width:min(37px,100%)}.barcell small{color:var(--muted);font-size:10px}.checkboxrow{display:flex;gap:8px;align-items:center;padding:8px;background:#e4efff;border-radius:9px}.checkboxrow input{width:auto;box-shadow:none}.hide{display:none!important}@media(max-width:1080px){.four{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}@media(max-width:760px){.app{display:block}.side{position:static;height:auto;padding:13px;gap:11px}.menu{display:flex;overflow:auto}.menu button{white-space:nowrap}.bottom{display:none}.main{padding:19px 12px}.panel{padding:16px}.fields,.three{grid-template-columns:1fr}.span{grid-column:auto}}

<script type="module">

const CONFIG={apiKey:'AIzaSyCMVuHrqk6MBIu21RYj4C8KAzFiTlrZWDs',authDomain:'cibao-cleaning.firebaseapp.com',projectId:'cibao-cleaning',storageBucket:'cibao-cleaning.firebasestorage.app',messagingSenderId:'333329266545',appId:'1:333329266545:web:d2a3fb5d71c985036c28d0',measurementId:'G-1KNHSHC2KY'};
const firebase=initializeApp(CONFIG),auth=getAuth(firebase),db=getFirestore(firebase);
const $=s=>document.querySelector(s), E=v=>String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const N=v=>Number.isFinite(Number(v))?Math.round(Number(v)*100)/100:0;
const cad=v=>new Intl.NumberFormat('en-CA',{style:'currency',currency:'CAD'}).format(N(v));
const dateLocal=()=>{let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const monthNow=()=>dateLocal().slice(0,7), asMonth=v=>String(v||'').slice(0,7), localTime=x=>x?.toDate?.()?.toLocaleString('es-CA')||'—';
const byId=(xs,id)=>xs.find(x=>x.id===id);
const S={user:null,admin:false,profile:null,approved:false,ready:false,view:'inicio',period:monthNow(),authMode:'login',users:[],offices:[],directory:[],hours:[],extras:[],adjustments:[],summaries:[],payslips:[],locks:[],subscriptions:[],loaded:{},loadErrors:{},adminDataReady:false,folder:null,backupStatus:'Sin carpeta elegida'};
const synthetic=username=>username+'@users.cibaocleaning.invalid';

function cachedAvatar(username){try{let photo=localStorage.getItem('cibao_photo_'+normUsername(username));return photo?`<img class="avatar big" src="${E(photo)}" alt="Foto de perfil">`:avatar(null,true)}catch{return avatar(null,true)}}

const ele=(c)=>document.getElementById(c);
function toast(msg,err=false){$('#toast').innerHTML=`<div class="toast" style="background:${err?'#b33d59':'#294a80'}">${E(msg)}</div>`;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').innerHTML='',5500)}
function formData(f){return Object.fromEntries(new FormData(f).entries())}
function avatar(p,big=false){let cls=big?'big':'';return p?.photo?`<img class="avatar ${cls}" src="${E(p.photo)}" alt="Perfil">`:`<div class="initial ${cls}">${E((p?.name||p?.username||'C')[0].toUpperCase())}</div>`}
function panel(title,inner){return `<section class="panel"><h2>${E(title)}</h2>${inner}</section>`}
function metric(title,value,foot){return `<section class="panel"><span class="muted fine">${E(title)}</span><div class="metric">${E(value)}</div><small class="muted">${E(foot)}</small></section>`}
const badge=v=>`<span class="pill ${E(v)}">${E(({pending:'Pendiente',approved:'Aprobado',rejected:'Rechazado',issued:'Cerrado',active:'Activo',inactive:'Inactivo'}[v])||v)}</span>`;
function choice(items,current){return items.map(o=>`<option value="${E(o.id)}" ${o.id===current?'selected':''}>${E(o.name)}</option>`).join('')}
function byName(id){return byId(S.users,id)?.name||S.profile?.name||'Empleado'}
function officeName(id){return id==='external'?'Trabajo externo':byId(S.offices,id)?.name||byId(S.directory,id)?.name||id||'Oficina'}
function isExternalHour(h){return h?.workType==='external'||h?.officeId==='external'}
function hourLocation(h){return isExternalHour(h)?'Trabajo externo: '+String(h.workLocation||'Sin lugar indicado'):officeName(h.officeId)}
function docId(uid,month){return `${uid}_${month}`}
function ownHours(uid,mo){return S.hours.filter(h=>h.userId===uid&&asMonth(h.workDate)===mo)}
function approvedHours(uid,mo){return ownHours(uid,mo).filter(h=>h.status==='approved')}
function signedEarnings(uid,mo){return approvedHours(uid,mo).reduce((v,h)=>v+N(h.hours)*N(h.rateAtEntry)+N(h.extraHours)*N(h.overtimeRateAtEntry),0)}
function officeLock(id,mo){return S.locks.find(x=>x.id===id+'_'+mo)}
function payrollOfficeIds(uid,mo) {
 const employee=byId(S.users,uid);
 const assigned=Array.isArray(employee?.officeIds)?employee.officeIds:[];
 const worked=approvedHours(uid,mo).filter(h=>!isExternalHour(h)).map(h=>h.officeId);
 return [...new Set([...assigned,...worked].filter(Boolean))];
}
function officeRoster(id,mo) {
 // Una oficina corresponde a sus empleados ACTIVOS ASIGNADOS. También se
 // conservan empleados con turnos aprobados en el período aunque hayan
 // sido reasignados después. No se debe contar solo los turnos del mes.
 const assigned=S.users.filter(u=>u.active===true && u.status==='active' && Array.isArray(u.officeIds) && u.officeIds.includes(id)).map(u=>u.id);
 const worked=S.hours.filter(h=>h.officeId===id && asMonth(h.workDate)===mo && h.status==='approved').map(h=>h.userId);
 return [...new Set([...assigned,...worked])].sort();
}
function computePayroll(uid,mo){
 const person=byId(S.users,uid);
 if(!person)throw Error('No existe el empleado');
 const hours=approvedHours(uid,mo);
  const externalRows=hours.filter(isExternalHour);
  const officeRows=hours.filter(h=>!isExternalHour(h));
  const externalHours=N(externalRows.reduce((v,h)=>v+N(h.hours),0));
  const externalOvertimeHours=N(externalRows.reduce((v,h)=>v+N(h.extraHours),0));
  const externalPay=N(externalRows.reduce((v,h)=>v+N(h.hours)*N(h.rateAtEntry)+N(h.extraHours)*N(h.overtimeRateAtEntry),0));
  const officeHours=N(officeRows.reduce((v,h)=>v+N(h.hours)+N(h.extraHours),0));
  const officeIds=payrollOfficeIds(uid,mo);
 const base=hours.reduce((v,h)=>v+N(h.hours)*N(h.rateAtEntry),0);
 const overtime=hours.reduce((v,h)=>v+N(h.extraHours)*N(h.overtimeRateAtEntry),0);
 const errors=[];
 const officeLines=officeIds.map(id=>{
  const office=byId(S.offices,id);
  const directory=byId(S.directory,id);
  if(!office){
   const name=directory?.name||id;
   errors.push('La oficina «'+name+'» está asignada pero no tiene precio de servicio configurado. Verifica Oficinas antes de pagar.');
   return {officeId:id,office:name,officeBase:0,officeExtras:0,officeTotal:0,participants:0,
    share:0,workedHours:N(hours.filter(h=>h.officeId===id).reduce((v,h)=>v+N(h.hours)+N(h.extraHours),0)),
    workerIds:[],workerNames:[],assigned:true,workedThisMonth:false,invalid:true};
  }
  const liveRoster=officeRoster(id,mo);
  const lock=officeLock(id,mo);
  const workerIds=lock?(Array.isArray(lock.workerIds)?lock.workerIds:[]):liveRoster;
  const participants=lock?Number(lock.participants):workerIds.length;
  const legacyLockMismatch=Boolean(lock && (!Array.isArray(lock.workerIds) ||
      participants!==lock.workerIds.length ||
      liveRoster.some(worker=>!workerIds.includes(worker))));
  if(legacyLockMismatch)errors.push('La oficina «'+office.name+'» tiene un cierre anterior con participantes distintos. No se debe alterar automáticamente: revisa los comprobantes ya emitidos.');
  if(!participants)errors.push('La oficina «'+office.name+'» no tiene participantes activos. Asigna empleados antes de liquidar.');
  const extra=S.extras.filter(x=>x.officeId===id && x.month===mo).reduce((v,x)=>v+N(x.amount),0);
  const officeBase=lock?N(lock.officeBase):N(office.servicePrice);
  const officeExtras=lock?N(lock.officeExtras):N(extra);
  const pool=lock?N(lock.officeTotal):N(officeBase+officeExtras);
  const totalCents=Math.round(pool*100);
  const baseCents=participants?Math.floor(totalCents/participants):0;
  const remainder=participants?totalCents-baseCents*participants:0;
  const rank=workerIds.indexOf(uid);
  const share=rank>=0?N((baseCents+(rank<remainder?1:0))/100):0;
  const workedHours=N(hours.filter(h=>h.officeId===id).reduce((v,h)=>v+N(h.hours)+N(h.extraHours),0));
  return {officeId:id,office:office.name,officeBase,officeExtras,officeTotal:pool,
    participants,share,workedHours,workerIds,workerNames:workerIds.map(worker=>byId(S.users,worker)?.name||'Empleado '+worker.slice(0,7)),
    assigned:Array.isArray(person.officeIds)&&person.officeIds.includes(id),
    workedThisMonth:workedHours>0,invalid:legacyLockMismatch};
 });
 const bonuses=S.adjustments.filter(x=>x.userId===uid&&x.month===mo&&x.type==='bonus').reduce((v,x)=>v+N(x.amount),0);
 const deductions=S.adjustments.filter(x=>x.userId===uid&&x.month===mo&&x.type==='discount').reduce((v,x)=>v+N(x.amount),0);
 const officeShare=N(officeLines.reduce((v,x)=>v+x.share,0));
 // IMP opcional: 3% del subtotal antes de descuentos manuales.
 // Este es un ajuste configurable interno, no una retención fiscal calculada por CRA.
 const grossBeforeDeductions=N(base+overtime+officeShare+bonuses);
 const impEnabled=person.impEnabled===true;
 const impRate=impEnabled?0.03:0;
 const impAmount=impEnabled?N(grossBeforeDeductions*impRate):0;
 return {userId:uid,employee:person.name,username:person.username||'',phone:person.phone||'',month:mo,
  baseHours:N(hours.reduce((v,h)=>v+N(h.hours),0)),
  overtimeHours:N(hours.reduce((v,h)=>v+N(h.extraHours),0)),
  hourlyPay:N(base),overtimePay:N(overtime),externalHours,externalOvertimeHours,externalPay,officeHours,officeShare,
  bonuses:N(bonuses),deductions:N(deductions),grossBeforeDeductions,
  impEnabled,impRate,impAmount,total:N(grossBeforeDeductions-deductions-impAmount),
  officeLines,hourIds:hours.map(x=>x.id),errors};
}
function monthSeries(n=7){let now=new Date();now.setDate(1);return Array.from({length:n},(_,i)=>{let dt=new Date(now.getFullYear(),now.getMonth()-n+1+i,1);return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')})}
function summary(uid,mo){return byId(S.summaries,docId(uid,mo))}
function payslip(uid,mo){return byId(S.payslips,docId(uid,mo))}
function employeeAmount(uid,mo){let slip=payslip(uid,mo);if(slip)return slip.total;let sum=summary(uid,mo);return sum?sum.total:signedEarnings(uid,mo)}
function graph(uid){let ms=monthSeries(),vs=ms.map(m=>employeeAmount(uid,m)),top=Math.max(1,...vs);return `<div class="bars">${ms.map((m,i)=>`<div class="barcell" title="${E(m)}: ${E(cad(vs[i]))}"><div class="bar" style="height:${Math.max(3,vs[i]/top*115)}px"></div><small>${E(m.slice(5))}</small></div>`).join('')}</div><p class="fine muted">Montos registrados por mes (CAD)</p>`}
function login(){const reg=S.authMode==='register',link=S.authMode==='admin-link';return `<div class="login"><section class="panel login-card"><div class="logo">C</div><h1 class="center">CIBAO CLEANING</h1><p class="center muted">Control de horas, nómina y facturas</p><div class="row" style="justify-content:center;margin:17px"><span id="login-avatar">${cachedAvatar('')}</span></div><div class="row" style="justify-content:center;margin-bottom:17px"><button class="tiny ${!reg&&!link?'primary':''}" data-action="auth-mode" data-mode="login">Ingresar</button><button class="tiny ${reg?'primary':''}" data-action="auth-mode" data-mode="register">Registrarme</button></div>${link?`<form class="stack" id="admin-link-form"><div class="callout">Este paso se hace solo una vez por dispositivo: vincula la cuenta administrativa existente de Firebase para entrar después escribiendo <b>admin</b>.</div><label>Correo de tu cuenta administrativa de Firebase<input type="email" name="email" required></label><label>Contraseña del administrador<input type="password" name="password" required autocomplete="current-password"></label><button type="submit" class="primary">Verificar y vincular administrador</button></form>`:reg?`<form class="stack" id="register-form"><label>Nombre completo<input name="name" required maxlength="90" autocomplete="name"></label><label>Crear nombre de usuario<input name="username" required pattern="[A-Za-z0-9_-]{3,24}" placeholder="Ejemplo: david" autocomplete="username"></label><label>Contraseña (mínimo 8 caracteres)<input name="password" type="password" minlength="8" required autocomplete="new-password"></label><label>Confirmar contraseña<input name="confirm" type="password" minlength="8" required autocomplete="new-password"></label><button class="primary" type="submit">Solicitar registro</button></form><p class="muted fine" style="margin-top:15px">Tu cuenta quedará pendiente de aprobación. No se solicita correo electrónico. Para recuperar una contraseña perdida será necesaria la ayuda del administrador.</p>`:`<form class="stack" id="login-form"><label>Nombre de usuario<input name="username" id="username-field" placeholder="Ejemplo: david o admin" required autocomplete="username"></label><label>Contraseña<input name="password" type="password" required autocomplete="current-password"></label><button class="primary" type="submit">Entrar al sistema</button></form><div class="row between" style="margin-top:16px"><button class="tiny flat" data-action="auth-mode" data-mode="admin-link">Vincular mi cuenta admin</button><small class="muted">Acceso protegido por Firebase</small></div>`}</section></div>`}
function pendingPage(){return `<div class="login"><section class="panel login-card center"><div class="logo">C</div><h1>Registro recibido</h1><div class="callout warning">Tu cuenta está <b>${S.profile?.status==='rejected'?'rechazada':'pendiente de aprobación'}</b>. El administrador asignará tus oficinas y tu tarifa por hora. No puedes registrar horas hasta que se apruebe.</div><p class="muted fine" style="margin-top:14px">Usuario: ${E(S.profile?.username||'')}</p><button data-action="logout">Cerrar sesión</button></section></div>`}
function menu(){const items=S.admin?[['inicio','🏠','Inicio'],['horas','⏱','Horas'],['empleados','👥','Empleados'],['oficinas','🏢','Oficinas'],['extras','✨','Servicios extra'],['ajustes','🎁','Bonos / descuentos'],['facturas','🧾','Facturas'],['pagos','💳','Pagos'],['respaldo','💾','Respaldo local']]:[['inicio','🏠','Mi estado'],['horas','⏱','Mis horas'],['pagos','💳','Mis pagos'],['perfil','👤','Mi perfil']];return `<aside class="side"><div class="brand"><div class="logo">C</div><div><b>CIBAO CLEANING</b><br><small>PAYROLL & INVOICES</small></div></div><nav class="menu">${items.map(([k,ico,v])=>`<button class="${S.view===k?'active':''}" data-action="page" data-view="${k}">${ico} ${E(v)}</button>`).join('')}</nav><div class="bottom stack"><div class="row">${avatar(S.profile)}<div><b>${E(S.profile?.name||'Administrador')}</b><div class="muted fine">${S.admin?'Administrador':'Empleado'}</div></div></div><button data-action="logout">Cerrar sesión</button></div></aside>`}

function employeeHome(){
 const uid=S.user.uid,slip=payslip(uid,S.period),draft=summary(uid,S.period);
 const rows=ownHours(uid,S.period),approved=rows.filter(x=>x.status==='approved'),pending=rows.filter(x=>x.status==='pending');
 const approvedH=N(approved.reduce((v,h)=>v+N(h.hours)+N(h.extraHours),0));
 const external=approved.filter(isExternalHour),externalH=N(external.reduce((v,h)=>v+N(h.hours)+N(h.extraHours),0));
 const base=N(signedEarnings(uid,S.period));
 const due=slip?0:draft?N(draft.total):null;
 const officeIds=[...new Set([...(S.profile?.officeIds||[]),...((draft?.officeLines||[]).map(l=>l.officeId))].filter(id=>id&&id!=='external'))];

function editEmployee(u){adminOnly();let body=`<div class="fields">${field('Nombre completo','name',u?.name,'text','required')}${field(u?'Usuario (solo lectura)':'Nuevo nombre de usuario','username',u?.username||'','text',u?'readonly':'required pattern="[A-Za-z0-9_-]{3,24}"')}${!u?field('Contraseña inicial','password','','password','required minlength="8"'):''}${field('Precio por hora (CAD)','rate',u?.rate??0,'number','min="0" step="0.01" required')}${field('Multiplicador horas extra','overtimeMultiplier',u?.overtimeMultiplier??1.5,'number','min="1" max="5" step="0.1" required')}${field('WhatsApp del empleado (opcional)','phone',u?.phone,'tel')}${select('Estado','status',[{id:'pending',name:'Pendiente'},{id:'active',name:'Activo (aprobado)'},{id:'rejected',name:'Rechazado'},{id:'inactive',name:'Inactivo'}],u?.active?'active':u?.status||'pending')}</div><div class="callout" style="margin:2px 0 10px"><label class="checkboxrow" style="font-size:14px;color:#253d63;cursor:pointer"><input type="checkbox" name="impEnabled" ${u?.impEnabled===true?'checked':''}><b>Aplicar IMP (3%) a los pagos de este empleado</b></label><p class="fine muted" style="margin:8px 0 0">Si se activa, se descuenta el 3% del subtotal de horas, reparto de oficinas, extras y bonificaciones. Los descuentos manuales se restan aparte. Solo el administrador puede cambiar esta opción. No modifica comprobantes ya emitidos.</p></div><h3>Oficinas asignadas</h3><div class="grid three">${S.offices.filter(o=>o.active!==false).map(o=>`<label class="checkboxrow"><input type="checkbox" name="officeIds" value="${E(o.id)}" ${(u?.officeIds||[]).includes(o.id)?'checked':''}>${E(o.name)}</label>`).join('')||'<div class="muted fine">Primero crea una oficina.</div>'}</div>`;showModal(u?'Editar empleado':'Crear perfil de empleado',body,async(b,f)=>{let offices=[...f.querySelectorAll('input[name=officeIds]:checked')].map(n=>n.value);let data={name:b.name.trim(),rate:N(b.rate),overtimeMultiplier:N(b.overtimeMultiplier),phone:b.phone.trim(),impEnabled:b.impEnabled==='on',active:b.status==='active',status:b.status,officeIds:offices,updatedAt:serverTimestamp()};if(!data.name||data.rate<0||data.overtimeMultiplier<1)throw Error('Verifica el nombre y las tarifas');if(u){const previous=[...(u.officeIds||[])].sort().join('|'),next=[...offices].sort().join('|');if((previous!==next||Boolean(u.active)!==Boolean(data.active))&&[...new Set([...(u.officeIds||[]),...offices])].some(id=>officeLock(id,S.period)))throw Error('Ya se emitieron comprobantes en una oficina afectada este mes. No cambies sus participantes durante el cierre; usa el mes siguiente o revisa los pagos antes de continuar.');await updateDoc(doc(db,'users',u.id),data)}else{let username=normUsername(b.username);if(!validUsername(username))throw Error('Nombre de usuario inválido o reservado');if(String(b.password).length<8)throw Error('Contraseña mínima: 8 caracteres');let app2=initializeApp(CONFIG,'creator-'+Date.now());let auth2=getAuth(app2);try{let cr=await createUserWithEmailAndPassword(auth2,synthetic(username),b.password);await setDoc(doc(db,'users',cr.user.uid),{...data,username,photo:'',createdAt:serverTimestamp()});await signOut(auth2)}finally{await deleteApp(app2)}}})}
function editHours(h){
 const admin=S.admin, users=admin?S.users.filter(x=>x.active):[S.profile];
 const currentId=h?.userId||(!admin?S.user.uid:users[0]?.id);
 const employee=byId(S.users,currentId)||S.profile;
 const external=!admin||Boolean(h&&isExternalHour(h));
 const officeOptions=[{id:'external',name:'Trabajo externo (fuera de las oficinas)'},...S.offices.filter(o=>o.active!==false).map(o=>({id:o.id,name:o.name}))];
 const typeControl=admin?select('Tipo / lugar del trabajo','officeId',officeOptions,h?.officeId||'external'):`<input type="hidden" name="officeId" value="external"><div class="callout"><b>TRABAJO EXTERNO</b><br>Estas horas no se atribuyen a ninguna oficina, ni modifican su reparto mensual.</div>`;
 const dateInput=admin?field('Fecha trabajada','workDate',h?.workDate||dateLocal(),'date','required'):
  `<label>Fecha del registro (automática)<input type="text" value="${E(dateLocal())}" readonly></label><input type="hidden" name="workDate" value="${E(dateLocal())}">`;
 showModal(h?'Editar registro':'Registrar horas trabajadas',`<div class="fields">
 ${admin?select('Empleado','userId',users.map(x=>({id:x.id,name:x.name})),currentId):`<input type="hidden" name="userId" value="${E(S.user.uid)}">`}
 ${typeControl}
 ${field('Lugar del trabajo externo','workLocation',h?.workLocation||'','text','maxlength="100" placeholder="Ej. Limpieza extraordinaria en cliente"')}
 ${dateInput}
 ${field('Horas normales','hours',h?.hours??0,'number','required min="0" max="24" step="0.25"')}
 ${field('Horas extra','extraHours',h?.extraHours??0,'number','min="0" max="24" step="0.25"')}
 </div><div class="callout"><p>Fecha y hora del registro: <b>automáticas al guardar</b>.</p><p>Tarifa fijada por el administrador: <b id="rateDisplay">${cad(employee?.rate)}</b>/h · Hora extra: <b id="overtimeDisplay">${cad(N(employee?.rate)*N(employee?.overtimeMultiplier??1.5))}</b>/h</p><p>Importe de este registro: <b id="hoursCalc">${cad(N(h?.hours??0)*N(employee?.rate)+N(h?.extraHours??0)*N(employee?.rate)*N(employee?.overtimeMultiplier??1.5))}</b></p><small>El registro quedará pendiente de aprobación. No cambia las oficinas asignadas ni las cantidades que se reparten entre ellas.</small></div>`,async b=>{
  const uid=admin?b.userId:S.user.uid,emp=admin?byId(S.users,uid):S.profile;
  const hours=N(b.hours),extra=N(b.extraHours),workDate=admin?b.workDate:dateLocal();
  const officeId=admin?b.officeId:'external', workType=officeId==='external'?'external':'office';
  const workLocation=String(b.workLocation||'').trim();
  if(!emp)throw Error('Empleado no encontrado');
  if(workType==='external'&&(workLocation.length<2||workLocation.length>100))throw Error('Escribe el lugar del trabajo externo (2 a 100 caracteres)');
  if(workType==='office'&&!byId(S.offices,officeId))throw Error('Selecciona una oficina válida');
  if(closed(uid,asMonth(workDate)))throw Error('Este mes ya fue pagado y cerrado para el empleado');
  if(workType==='office'&&officeLock(officeId,asMonth(workDate)))throw Error('La oficina ya está cerrada para este mes');
  if(hours<0||extra<0||hours+extra<=0||hours+extra>24)throw Error('Horas inválidas: máximo 24 horas en total por registro');
  const rate=N(emp.rate),overRate=N(rate*N(emp.overtimeMultiplier??1.5));
  const x={userId:uid,officeId,workType,workLocation:workType==='external'?workLocation:'',workDate,month:asMonth(workDate),hours,extraHours:extra,rateAtEntry:rate,overtimeRateAtEntry:overRate,total:N(hours*rate+extra*overRate),status:admin?(h?.status||'approved'):'pending'};
  if(h){adminOnly();await updateDoc(doc(db,'hours',h.id),{...x,updatedAt:serverTimestamp()})}
  else await addDoc(collection(db,'hours'),{...x,createdAt:serverTimestamp()});
 })
}

function editAdjustment(x){adminOnly();showModal(x?'Editar bono/descuento':'Nuevo bono/descuento',`<div class="fields">${select('Empleado','userId',S.users.filter(u=>u.active).map(u=>({id:u.id,name:u.name})),x?.userId||S.users.find(u=>u.active)?.id)}${field('Mes','month',x?.month||S.period,'month','required')}${select('Tipo','type',[{id:'bonus',name:'Bonificación'},{id:'discount',name:'Descuento'}],x?.type||'bonus')}${field('Importe','amount',x?.amount??0,'number','min="0" step="0.01" required')}${field('Motivo','description',x?.description,'text','required')}</div>`,async b=>{if(closed(b.userId,b.month))throw Error('El período ya está cerrado');let rec={userId:b.userId,month:b.month,type:b.type,amount:N(b.amount),description:b.description.trim()};if(x)await updateDoc(doc(db,'adjustments',x.id),rec);else await addDoc(collection(db,'adjustments'),{...rec,createdAt:serverTimestamp()})})}
function detailPayroll(uid){adminOnly();if(!S.adminDataReady)throw Error('Espera a que terminen de cargarse empleados, oficinas y horas.');let p=payslip(uid,S.period)||computePayroll(uid,S.period);$('#modal').innerHTML=`<div class="modalbg"><section class="panel modal"><div class="row between"><h2>Desglose — ${E(p.employee)} · ${E(S.period)}</h2><button data-action="close-modal">✕</button></div>${payrollHtml(p)}<div class="row" style="margin-top:18px"><button data-action="pdf-payroll" data-id="${E(uid)}" class="primary">Descargar comprobante PDF</button><button data-action="share-payroll" data-id="${E(uid)}">Preparar WhatsApp</button>${!payslip(uid,S.period)?`<button data-action="finalize-payroll" data-id="${E(uid)}">Confirmar pago y envío</button>`:''}</div></section></div>`}

function preparePDF(p){if(p.errors?.length)throw Error('No se puede generar un comprobante incompleto: '+p.errors.join(' | '));const title=`Comprobante_${p.employee.replace(/[^a-zA-Z0-9_-]/g,'_')}_${p.month}.pdf`;let jsPDF=window.jspdf?.jsPDF;if(!jsPDF){printReceipt(p);return}let docx=new jsPDF({unit:'mm',format:'a4'}),y=18;const line=(s,dy=7,bold=false)=>{docx.setFont('helvetica',bold?'bold':'normal');docx.text(String(s).normalize('NFKD').replace(/[\u0300-\u036f]/g,''),15,y,{maxWidth:180});y+=dy};docx.setFontSize(19);line('CIBAO CLEANING',12,true);docx.setFontSize(11);line('COMPROBANTE DE LIQUIDACION / PAGO',8,true);line('Empleado: '+p.employee,7);line('Periodo: '+p.month,7);line('Horas normales: '+p.baseHours+' h | Pago: '+cad(p.hourlyPay),7);line('Horas extra: '+p.overtimeHours+' h | Pago: '+cad(p.overtimePay),10);line('DESGLOSE DE OFICINAS',9,true);for(const o of p.officeLines||[]){if(y>265){docx.addPage();y=19}line(o.office+' | Total '+cad(o.officeTotal)+' / '+o.participants+' = '+cad(o.share),7);line('  Base '+cad(o.officeBase)+' | Servicios extra '+cad(o.officeExtras)+' | Horas: '+o.workedHours,7);line('  Participantes: '+(o.workerNames||[]).join(', '),9)}y+=5;if(y>260){docx.addPage();y=19}line('Horas de trabajo externo: '+String(p.externalHours||0)+' h; valor: '+cad(p.externalPay||0),7);line('Reparto de oficinas: '+cad(p.officeShare),7);line('Bonificaciones: '+cad(p.bonuses),7);line('Descuentos manuales: -'+cad(p.deductions),7);line('IMP (3%): -'+cad(p.impAmount||0)+(p.impEnabled===true?' [ACTIVO]':' [NO APLICA]'),9);docx.setFontSize(15);line('TOTAL NETO: '+cad(p.total),11,true);docx.setFontSize(9);line('Documento administrativo. Verifique obligaciones fiscales y deducciones legales.',6);line(p.issuedAt?'Periodo cerrado.':'Borrador: sujeto a revision y confirmacion.',6);docx.save(title)}
function printReceipt(p){let w=window.open('','_blank');if(!w)throw Error('Permite ventanas emergentes o habilita la biblioteca PDF');w.document.write(`<html><head><title>Comprobante</title><style>body{font:14px Arial;margin:30px;color:#253d63}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #ccd}h1{color:#2862ed}</style></head><body><h1>CIBAO CLEANING</h1><h2>Comprobante ${E(p.employee)} — ${E(p.month)}</h2>${payrollHtml(p)}<button onclick="print()">Imprimir / Guardar como PDF</button></body></html>`);w.document.close()}
function shareReceipt(p){if(p.errors?.length)throw Error('Revisa el reparto antes de preparar WhatsApp: '+p.errors.join(' | '));let phone=String(p.phone||byId(S.users,p.userId)?.phone||'').replace(/\D/g,'');let msg=`CIBAO CLEANING\nComprobante de pago de ${p.employee}\nPeriodo: ${p.month}\nTotal: ${cad(p.total)}\nAdjunto el comprobante PDF manualmente.`;$('#modal').innerHTML=`<div class="modalbg"><section class="panel modal"><div class="row between"><h2>Enviar comprobante — ${E(p.employee)}</h2><button data-action="close-modal">✕</button></div><div class="callout warning">Primero descarga el PDF y adjúntalo en WhatsApp. Abrir WhatsApp no confirma que el empleado recibió el comprobante.</div><p style="margin-top:14px">Destinatario: ${E(phone||'sin número; completar en Empleados')}</p><textarea readonly>${E(msg)}</textarea><div class="row" style="margin-top:15px"><button class="primary" data-action="${payslip(p.userId,p.month)?'history-pdf':'pdf-payroll'}" data-id="${E(payslip(p.userId,p.month)?.id||p.userId)}">Descargar PDF</button><a href="https://wa.me/${E(phone)}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener" class="pill">Abrir WhatsApp</a>${!payslip(p.userId,p.month)?`<button data-action="finalize-payroll" data-id="${E(p.userId)}">Confirmar pago y entrega</button>`:''}</div></section></div>`}
async function finalize(uid){adminOnly();if(!S.adminDataReady)throw Error('La información de nómina todavía se está sincronizando.');let mo=S.period,person=byId(S.users,uid);if(!person)throw Error('Empleado no encontrado');if(payslip(uid,mo))throw Error('Ese período ya está cerrado');let p=computePayroll(uid,mo);if(p.errors?.length)throw Error('Corrige antes de confirmar: '+p.errors.join(' | '));if(!p.hourIds.length&&!p.officeLines.some(l=>l.share>0))throw Error('El empleado no tiene horas aprobadas ni reparto de oficinas este mes');if(S.hours.some(h=>h.userId===uid&&asMonth(h.workDate)===mo&&h.status==='pending'))throw Error('El empleado tiene horas pendientes, incluidos trabajos externos; revísalas antes de confirmar el pago');let offices=p.officeLines.map(x=>x.officeId);if(S.hours.some(h=>offices.includes(h.officeId)&&asMonth(h.workDate)===mo&&h.status==='pending'))throw Error('Hay horas pendientes en una de estas oficinas. Revisa todas las horas de sus trabajadores antes del primer cierre.');if(!confirm(`¿CONFIRMAS que pagaste ${cad(p.total)} a ${person.name} y entregaste su PDF?\n\nSe guardará el comprobante, el mes quedará cerrado para esta persona y las oficinas correspondientes quedarán bloqueadas para añadir nuevas horas durante ${mo}. Los registros históricos permanecerán.`))return;let slipRef=doc(db,'payslips',docId(uid,mo)),locks=p.officeLines.map(x=>({ref:doc(db,'officeClosures',x.officeId+'_'+mo),line:x}));await runTransaction(db,async t=>{let found=await t.get(slipRef);if(found.exists())throw Error('Ya existe una liquidación de este período');let existing=[];for(const o of locks)existing.push(await t.get(o.ref));t.set(slipRef,{...p,issuedAt:serverTimestamp(),status:'issued',deliveryConfirmed:true});for(let i=0;i<locks.length;i++){if(!existing[i].exists()){let x=locks[i].line;t.set(locks[i].ref,{month:mo,officeId:x.officeId,officeBase:x.officeBase,officeExtras:x.officeExtras,officeTotal:x.officeTotal,participants:x.participants,workerIds:[...x.workerIds],workerNames:[...x.workerNames],share:x.share,lockedAt:serverTimestamp()})}}});toast('Período cerrado. Comprobante guardado en Pagos.');closeModal()}

async function publishAll(){
 adminOnly();if(!S.adminDataReady)throw Error('Espera la sincronización antes de publicar.');
 const list=S.users.filter(u=>u.active&&!payslip(u.id,S.period));
 if(!list.length)throw Error('No hay cuentas abiertas');
 const batch=writeBatch(db);
 for(const u of list){
  const p=computePayroll(u.id,S.period);
  if(p.errors?.length)throw Error('No se publicó el estado de '+u.name+': '+p.errors.join(' | '));
  const visibleLines=p.officeLines.map(l=>({officeId:l.officeId,office:l.office,officeBase:l.officeBase,officeExtras:l.officeExtras,officeTotal:l.officeTotal,participants:l.participants,share:l.share,workedHours:l.workedHours,assigned:l.assigned}));
  batch.set(doc(db,'publishedSummaries',docId(u.id,S.period)),{
   userId:p.userId,employee:p.employee,month:p.month,baseHours:p.baseHours,overtimeHours:p.overtimeHours,
   hourlyPay:p.hourlyPay,overtimePay:p.overtimePay,externalHours:p.externalHours,externalOvertimeHours:p.externalOvertimeHours,externalPay:p.externalPay,
   officeShare:p.officeShare,officeLines:visibleLines,bonuses:p.bonuses,deductions:p.deductions,grossBeforeDeductions:p.grossBeforeDeductions,
   impEnabled:p.impEnabled,impAmount:p.impAmount,total:p.total,updatedAt:serverTimestamp()
  });
 }
 await batch.commit();toast('Estados mensuales completos publicados para los empleados');
}
function backupSnapshot(){return {version:3,exportedAt:new Date().toISOString(),project:'CIBAO CLEANING',collections:{users:S.users,offices:S.offices,officeDirectory:S.directory,hours:S.hours,officeExtras:S.extras,adjustments:S.adjustments,publishedSummaries:S.summaries,payslips:S.payslips,officeClosures:S.locks}}}
function dl(name,body,mime='application/json'){let u=URL.createObjectURL(new Blob([body],{type:mime}));let a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1500)}
async function saveBackup(){if(!S.folder)throw Error('Selecciona una carpeta');let perm=await S.folder.queryPermission({mode:'readwrite'});if(perm!=='granted'){perm=await S.folder.requestPermission({mode:'readwrite'});if(perm!=='granted')throw Error('No hay permiso de escritura en la carpeta')}let s=backupSnapshot(),sub=await S.folder.getDirectoryHandle('respaldo',{create:true});for(let [key,data] of Object.entries({...s.collections,ultimo_respaldo:s})){let f=await sub.getFileHandle(key+'.json',{create:true});let w=await f.createWritable();await w.write(JSON.stringify(data,null,2));await w.close()}S.backupStatus='Última copia: '+new Date().toLocaleString('es-CA');render()}
function folderDb(){return new Promise((resolve,reject)=>{let req=indexedDB.open('cibao_folder_v3',1);req.onupgradeneeded=()=>req.result.createObjectStore('data');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function storeFolderHandle(handle){let d=await folderDb();await new Promise((ok,fail)=>{let t=d.transaction('data','readwrite');t.objectStore('data').put(handle,'folder');t.oncomplete=ok;t.onerror=()=>fail(t.error)});d.close()}
async function loadFolderHandle(){let d=await folderDb();let v=await new Promise((ok,fail)=>{let t=d.transaction('data','readonly'),r=t.objectStore('data').get('folder');r.onsuccess=()=>ok(r.result);r.onerror=()=>fail(r.error)});d.close();return v}
let backupTimer;function scheduleBackup(){if(!S.admin||!S.folder)return;clearTimeout(backupTimer);backupTimer=setTimeout(()=>saveBackup().catch(()=>{}),2600)}
function subscribe(key,ref){let cancel=onSnapshot(ref,snap=>{S[key]=snap.docs.map(d=>({id:d.id,...d.data()}));S.loaded[key]=true;if(S.admin){S.adminDataReady=['users','offices','directory','hours','extras','adjustments','summaries','payslips','locks'].every(k=>S.loaded[k]);scheduleBackup()}render()},err=>{S.loadErrors[key]=err.message;toast('Error de lectura '+key+': '+err.message,true);render()});S.subscriptions.push(cancel)}
function unsubscribeAll(){S.subscriptions.forEach(fn=>fn());S.subscriptions=[]}
async function session(user){unsubscribeAll();S.user=user;S.admin=false;S.profile=null;S.approved=false;S.ready=false;S.employeeDataSubscribed=false;S.loaded={};S.loadErrors={};S.adminDataReady=false;for(const k of ['users','offices','directory','hours','extras','adjustments','summaries','payslips','locks'])S[k]=[];render();if(!user){S.ready=true;render();return}try{let adminSnap=await getDoc(doc(db,'admins',user.uid));S.admin=adminSnap.exists();if(S.admin){S.approved=true;S.profile={id:user.uid,name:adminSnap.data().name||'Administrador',username:'admin'};subscribe('users',collection(db,'users'));subscribe('offices',collection(db,'offices'));subscribe('directory',collection(db,'officeDirectory'));subscribe('hours',collection(db,'hours'));subscribe('extras',collection(db,'officeExtras'));subscribe('adjustments',collection(db,'adjustments'));subscribe('summaries',collection(db,'publishedSummaries'));subscribe('payslips',collection(db,'payslips'));subscribe('locks',collection(db,'officeClosures'));loadFolderHandle().then(h=>{if(h){S.folder=h;S.backupStatus='Carpeta recordada: '+h.name+' (puede necesitar permiso)';render()}}).catch(()=>{})}else{S.subscriptions.push(onSnapshot(doc(db,'users',user.uid),s=>{S.profile=s.exists()?{id:s.id,...s.data()}:null;cacheAvatar(S.profile);S.users=S.profile?[S.profile]:[];S.approved=S.profile?.active===true&&S.profile?.status==='active';if(S.approved&&!S.employeeDataSubscribed){S.employeeDataSubscribed=true;subscribe('directory',collection(db,'officeDirectory'));for(let [key,col] of [['hours','hours'],['adjustments','adjustments'],['summaries','publishedSummaries'],['payslips','payslips']])subscribe(key,query(collection(db,col),where('userId','==',user.uid)))}render()},err=>toast('Perfil: '+err.message,true)))}S.ready=true;S.view='inicio';render()}catch(e){S.ready=true;toast('No se pudo cargar la sesión: '+e.message,true);render()}}
onAuthStateChanged(auth,session);
function errorMsg(err){let s=String(err?.message||err);if(s.includes('auth/invalid-credential'))return 'Usuario o contraseña incorrectos.';if(s.includes('auth/email-already-in-use'))return 'Ese nombre de usuario ya existe.';if(s.includes('permission-denied'))return 'Firebase denegó esta operación: comprueba las reglas.';if(s.includes('auth/weak-password'))return 'La contraseña es demasiado débil.';if(s.includes('auth/network-request-failed'))return 'Error de conexión con Firebase.';return s}
document.addEventListener('input',e=>{if(e.target.id==='username-field'){let a=ele('login-avatar');if(a)a.innerHTML=cachedAvatar(e.target.value)}});
function closeModal(){$('#modal').innerHTML='';S.modalSubmit=null}
function compress(file){return new Promise((resolve,reject)=>{if(!file)return reject(Error('Selecciona una imagen'));let url=URL.createObjectURL(file),im=new Image();im.onload=()=>{let k=Math.min(1,250/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);resolve(c.toDataURL('image/jpeg',.65))};im.onerror=()=>reject(Error('No se pudo leer la imagen'));im.src=url})}
document.addEventListener('click',async ev=>{let b=ev.target.closest('[data-action]');if(!b)return;let a=b.dataset.action,id=b.dataset.id;try{if(a==='auth-mode'){S.authMode=b.dataset.mode;render();return}if(a==='close-modal'){closeModal();return}if(a==='page'){S.view=b.dataset.view;render();return}if(a==='logout'){await signOut(auth);return}if(a==='new-office')editOffice();if(a==='edit-office')editOffice(byId(S.offices,id));if(a==='new-employee')editEmployee();if(a==='edit-employee')editEmployee(byId(S.users,id));if(a==='new-hours')editHours();if(a==='edit-hours')editHours(byId(S.hours,id));if(a==='new-extra')editExtra();if(a==='edit-extra')editExtra(byId(S.extras,id));if(a==='new-adjustment')editAdjustment();if(a==='edit-adjustment')editAdjustment(byId(S.adjustments,id));if(a==='detail-payroll')detailPayroll(id);if(a==='pdf-payroll')preparePDF(payrollFor(id));if(a==='share-payroll')shareReceipt(payrollFor(id));if(a==='finalize-payroll')await finalize(id);if(a==='publish-all')await publishAll();if(a==='history-pdf')preparePDF(byId(S.payslips,id));if(a==='share-history')shareReceipt(byId(S.payslips,id));if(a==='hour-status'){adminOnly();let h=byId(S.hours,id);if(closed(h.userId,asMonth(h.workDate))||(!isExternalHour(h)&&officeLock(h.officeId,asMonth(h.workDate))))throw Error('La oficina o período ya están cerrados');await updateDoc(doc(db,'hours',id),{status:b.dataset.status,reviewedAt:serverTimestamp()});toast('Horas revisadas')}if(a==='select-folder'){adminOnly();if(!window.showDirectoryPicker)throw Error('Usa Chrome o Edge con HTTPS para seleccionar carpetas');S.folder=await showDirectoryPicker({mode:'readwrite',id:'cibao-cleaning',startIn:'documents'});await storeFolderHandle(S.folder);await saveBackup();toast('Carpeta seleccionada; se guardó respaldo')}if(a==='save-backup'){adminOnly();await saveBackup();toast('Respaldo actualizado')}if(a==='download-backup'){adminOnly();dl('CIBAO_CLEANING_'+dateLocal()+'.json',JSON.stringify(backupSnapshot(),null,2))}}catch(e){toast(errorMsg(e),true)}});
document.addEventListener('change',e=>{if(e.target.id==='period'){S.period=e.target.value;render()}});
document.addEventListener('input',e=>{if(e.target.closest('#edit-form')&&['hours','extraHours','userId'].includes(e.target.name)){let f=ele('edit-form'),uid=f?.userId?.value||S.user?.uid,u=byId(S.users,uid)||S.profile,r=N(u?.rate),ov=N(u?.overtimeMultiplier??1.5);if(ele('rateDisplay'))ele('rateDisplay').textContent=cad(r);if(ele('overtimeDisplay'))ele('overtimeDisplay').textContent=cad(r*ov);if(ele('hoursCalc'))ele('hoursCalc').textContent=cad(N(f?.hours?.value)*r+N(f?.extraHours?.value)*r*ov)}});
document.addEventListener('submit',async e=>{e.preventDefault();let f=e.target,button=f.querySelector('[type=submit]');if(button)button.disabled=true;try{let b=formData(f);if(f.id==='login-form'){let username=normUsername(b.username);let email;if(username==='admin'){email=localStorage.getItem('cibao_admin_email');if(!email){S.authMode='admin-link';render();throw Error('Primero vincula tu cuenta de administrador en este dispositivo.')}}else{if(!validUsername(username))throw Error('Nombre de usuario inválido');email=synthetic(username)}await signInWithEmailAndPassword(auth,email,b.password);return}if(f.id==='admin-link-form'){let result=await signInWithEmailAndPassword(auth,b.email.trim().toLowerCase(),b.password);let role=await getDoc(doc(db,'admins',result.user.uid));if(!role.exists()){await signOut(auth);throw Error('Esa cuenta no tiene permisos de administrador.')}localStorage.setItem('cibao_admin_email',b.email.trim().toLowerCase());S.authMode='login';toast('Cuenta admin vinculada: usa «admin» para entrar en este dispositivo.');return}if(f.id==='register-form'){let username=normUsername(b.username);if(!validUsername(username))throw Error('Usa 3 a 24 caracteres (letras sin acento, números, guion o _). No se permite admin.');if(b.password!==b.confirm)throw Error('Las contraseñas no coinciden');if(b.password.length<8)throw Error('La contraseña debe tener al menos 8 caracteres');let cred=await createUserWithEmailAndPassword(auth,synthetic(username),b.password);await setDoc(doc(db,'users',cred.user.uid),{name:String(b.name).trim(),username,active:false,status:'pending',rate:0,overtimeMultiplier:1.5,officeIds:[],phone:'',photo:'',createdAt:serverTimestamp()});toast('Registro enviado. Espera aprobación del administrador.');return}if(f.id==='edit-form'&&S.modalSubmit){await S.modalSubmit(b,f);closeModal();toast('Datos guardados');return}if(f.id==='photo-form'){let img=await compress(f.photo.files[0]);await updateDoc(doc(db,'users',S.user.uid),{photo:img,updatedAt:serverTimestamp()});toast('Foto guardada');return}if(f.id==='password-form'){await updatePassword(auth.currentUser,b.password);toast('Contraseña cambiada');f.reset();return}}catch(err){toast(errorMsg(err),true)}finally{if(button)button.disabled=false}});
</script></body></html>
